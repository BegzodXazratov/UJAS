<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdiringizni Biling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Roboto:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            background-image: 
                linear-gradient(to bottom, rgba(0, 30, 0, 0.7), rgba(0, 0, 0, 1)),
                url('https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: #00ff7f; /* Asosiy rang yashil-qora vibe uchun */
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Qon tomchilari yozayotganda oqib tushadi */
        .blood-drop {
            position: absolute;
            width: 4px;
            height: 25px;
            background: linear-gradient(to bottom, rgba(139,0,0,0), rgba(200,0,0,0.8), rgba(255,0,0,1));
            border-radius: 50%;
            animation: dropFall linear forwards;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 0 3px #ff0000);
        }

        @keyframes dropFall {
            0% { top: -20px; opacity: 0; height: 10px;}
            10% { opacity: 0.9; height: 40px;}
            80% { opacity: 0.8; height: 100px;}
            100% { top: 110vh; opacity: 0; height: 200px; }
        }

        /* --- Jumpscare (Oxirgi qonli ekran) --- */
        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #aa0000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            animation: intenseShake 0.1s infinite;
        }

        .blood-splatter {
            position: absolute;
            background: radial-gradient(circle, #ff0000 0%, #8b0000 40%, transparent 70%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            opacity: 0;
            animation: splashOut 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 10000;
        }

        @keyframes splashOut {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0.9; }
        }

        #jumpscare-overlay h1 {
            font-family: 'Nosifer', cursive;
            font-size: 80px;
            color: #000;
            text-shadow: 0 0 30px #fff, 0 0 50px #ff0000;
            text-transform: uppercase;
            text-align: center;
            z-index: 10001;
            animation: popText 0.3s ease-out forwards;
        }

        @keyframes popText {
            0% { transform: scale(0.1); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes intenseShake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            25% { transform: translate(-3px, -4px) rotate(-1deg); }
            50% { transform: translate(-4px, 2px) rotate(1deg); }
            75% { transform: translate(4px, -2px) rotate(-1deg); }
            100% { transform: translate(-2px, 3px) rotate(0deg); }
        }

        /* --- Asosiy oyna dizayni --- */
        #start-btn {
            padding: 20px 50px;
            font-size: 26px;
            font-family: 'Nosifer', cursive;
            color: #006400;
            background: rgba(0, 20, 0, 0.6);
            border: 2px solid #006400;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            text-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            border-radius: 10px;
        }

        #start-btn:hover {
            color: #00ff7f;
            border-color: #00ff7f;
            background: rgba(0, 50, 0, 0.8);
            box-shadow: 0 0 50px rgba(0, 255, 127, 0.8), inset 0 0 20px rgba(0, 255, 127, 0.3);
            transform: scale(1.1);
        }

        #generator-modal {
            display: none;
            flex-direction: column;
            background: rgba(0, 15, 0, 0.95); 
            border: 1px solid #004d00;
            padding: 40px;
            border-radius: 15px;
            z-index: 10;
            box-shadow: 0 0 60px rgba(0, 255, 127, 0.2);
            width: 90%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #generator-modal h1 {
            font-family: 'Creepster', cursive;
            font-size: 40px;
            color: #00ff7f;
            margin-bottom: 30px;
            text-shadow: 3px 3px 10px #000, 0 0 20px #006400;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #0a140a;
            border: 1px solid #003300;
            color: #00ff7f;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            background: #1a0505;
        }

        #generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            font-family: 'Creepster', cursive;
            color: #000; 
            background: #008000;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff7f;
        }

        #generate-btn:hover:not(:disabled) {
            background: #00ff7f;
            box-shadow: 0 0 30px #00ff7f;
            transform: scale(1.02);
        }

        #generate-btn:disabled {
            background: #113311;
            color: #336633;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 35px;
            font-size: 20px;
            line-height: 1.6;
            color: #e6e6e6;
            text-shadow: 0 0 10px rgba(0, 255, 127, 0.5);
            min-height: 80px;
            text-align: left;
        }
        
        .highlight {
            color: #ff3333;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 15px #ff0000;
        }

        .name-highlight {
            color: #00ff7f;
            font-family: 'Creepster', cursive;
            font-size: 32px;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 15px;
            text-align: center;
        }

        .god-knows {
            display: block;
            margin-top: 30px;
            font-size: 18px;
            font-style: italic;
            color: #55aa55;
            text-align: right;
        }
        
        .loading-text {
            color: #00ff7f;
            font-style: italic;
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="audio-container" style="display:none;"></div>

    <button id="start-btn">Eshikni Ochish...</button>

    <div id="generator-modal">
        <h1>Taqdiringiz bitilgan</h1>
        <input type="text" id="userName" placeholder="Ismingizni kiriting..." required autocomplete="off">
        <input type="number" id="userAge" placeholder="Yoshingizni kiriting..." required min="1" max="120">
        <button id="generate-btn">O'lim generatori</button>
        <div id="result"></div>
    </div>
    
    <div id="jumpscare-overlay">
        <h1>YO'QOL MUNOFIQ!</h1>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const modal = document.getElementById('generator-modal');
        const generateBtn = document.getElementById('generate-btn');
        const resultDiv = document.getElementById('result');
        const audioContainer = document.getElementById('audio-container');
        const inputs = document.querySelectorAll('input');
        const jumpscareOverlay = document.getElementById('jumpscare-overlay');

        let attempts = 0; 
        const MAX_ATTEMPTS = 3;
        
        function createBloodDrop() {
            const drop = document.createElement('div');
            drop.classList.add('blood-drop');
            drop.style.left = Math.random() * 100 + 'vw';
            
            const sizeMultiplier = Math.random() * 1.5 + 0.5;
            drop.style.transform = `scale(${sizeMultiplier})`;
            
            drop.style.animationDuration = (Math.random() * 1.5 + 0.8) + 's'; 
            
            document.body.appendChild(drop);
            setTimeout(() => { drop.remove(); }, 2500);
        }

        // Qon faqat inputlarga nimadir yozilganda ekrandan oqib tushadi
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                for(let i=0; i<3; i++) {
                    createBloodDrop();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            audioContainer.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/MPa-y1LQjOk?autoplay=1&loop=1&playlist=MPa-y1LQjOk" frameborder="0" allow="autoplay"></iframe>`;
            startBtn.style.display = 'none';
            modal.style.display = 'flex';
        });

        function calculateDeathDate(currentAge) {
            const baseDate = new Date(2026, 7, 1);
            
            let maxLifespan = 85; 
            if (currentAge >= 80) maxLifespan = currentAge + 5;
            
            let yearsLeft = maxLifespan - currentAge;
            if (yearsLeft < 1) yearsLeft = 1; 

            // Tasodifiy erta o'lim ehtimoli
            if (Math.random() < 0.25 && yearsLeft > 5) {
                yearsLeft = Math.floor(Math.random() * 5) + 1;
            }

            const randomDaysLeft = Math.floor(Math.random() * (yearsLeft * 365));
            const deathDate = new Date(baseDate.getTime() + (randomDaysLeft * 24 * 60 * 60 * 1000));
            
            const dd = String(deathDate.getDate()).padStart(2, '0');
            const mm = String(deathDate.getMonth() + 1).padStart(2, '0');
            const yyyy = deathDate.getFullYear();
            
            const deathAge = currentAge + Math.floor(randomDaysLeft / 365);
            return { formattedDate: `${dd}.${mm}.${yyyy}`, deathAge: deathAge };
        }

        function triggerJumpscare() {
            modal.style.display = 'none';
            jumpscareOverlay.style.display = 'flex';
            
            // Orqadagi YouTube musiqasini o'chirib, Dahshatli qichqiriqni yoqamiz
            audioContainer.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/4JvJd6BkBJ4?autoplay=1" frameborder="0" allow="autoplay"></iframe>`;
            
            // Ekranga qon dog'larini sachratamiz
            for(let i=0; i<30; i++) {
                let splatter = document.createElement('div');
                splatter.classList.add('blood-splatter');
                splatter.style.width = (Math.random() * 200 + 100) + 'px';
                splatter.style.height = (Math.random() * 200 + 100) + 'px';
                splatter.style.left = (Math.random() * 100 - 10) + 'vw';
                splatter.style.top = (Math.random() * 100 - 10) + 'vh';
                splatter.style.animationDelay = (Math.random() * 0.2) + 's';
                jumpscareOverlay.appendChild(splatter);
            }
        }

        const storyParts = {
            locations: [
                "kimsasiz va qorong'i qabristonda", "eski, zax va tashlandiq shifoxonada", 
                "uzoq yillik qorong'i yerto'la qa'rida", "qalin va sovuq o'rmon o'rtasida", 
                "jimjit va izg'irinli daryo bo'yida", "tungi soat uchda o'z yotog'ingda", 
                "zanglagan eski lift ichida qamalib", "qon hidi anqib turgan omborxonada",
                "yomg'irli kunda kimsasiz bekatingizda", "buzilib yotgan cherkov xarobalarida",
                "oy nuri umuman tushmaydigan tor ko'chada", "oynalari siniq eski qasrda",
                "kimsasiz cho'l o'rtasida", "qop-qorong'i metro tunneli ostida",
                "hech kim yashamaydigan huvillagan qishloqda", "chirigan yog'och uyning chardog'ida",
                "ko'zgular bilan qoplangan telbalar xonasida", "qonli vannada", 
                "jarlik yoqasida", "zaharli gazlarga to'la zavod ichida"
            ],
            events: [
                "noma'lum qora sharpa ortingdan kelib tomog'ingdan bo'g'adi",
                "ko'zgudan uzatilgan chirigan qo'llar seni o'ziga tortib ketadi",
                "devordan sizib chiqqan qonli sharpalar seni o'rab oladi",
                "yer to'satdan yorilib, tubsiz zulmat olovi seni yutib yuboradi",
                "o'zingning soyang tirilib, senga hujum qiladi va tanangni parchalaydi",
                "ko'zlari qonga to'lgan yuzsiz mavjudot tiriklayin yuragingni sug'urib oladi",
                "minglab qora o'rgimchaklar tanangni yorib kirib, ichingni kemirib bitiradi",
                "deraza ortidan qarab turgan jinlar aql-hushingni olib, o'z joniga qasd qilishga majburlaydi",
                "osmondan tushgan olovli meteorit vujudingni kulga aylantiradi",
                "eski la'nat uyg'onib, bir soniyada butun qoningni muzlatib qo'yadi",
                "yer ostidan chiqqan murdalar oyoqlaringdan tortib, o'zlari bilan go'rga tiqadi",
                "noma'lum qora virus bir necha daqiqada suyaklaringni eritib yuboradi",
                "ko'zga ko'rinmas shafqatsiz pichoqlar butun tanangni tilkalab tashlaydi",
                "sovuq tuman ichidan chiqqan maxluq seni burda-burda qilib yeydi",
                "do'zax itlari iskaragi seni quvib yetib tomog'ingni g'ajib tashlaydi",
                "o'z yaqining qiyofasiga kirgan shayton seni sovuqqonlik bilan so'yib tashlaydi",
                "shiftda yashiringan ko'rshapalak-odam tepangdan sakrab boshingni uzib oladi",
                "bo'yningga sirtmoq tashlagan ko'rinmas kuch seni osib qo'yadi",
                "vujuding o'z-o'zidan yonishni boshlaydi va tiriklayin jizzig'ing chiqadi",
                "ongingni egallab olgan iblis seni eng baland binodan sakrashga undaydi"
            ],
            conclusions: [
                "Nafasing uzilayotganda faqatgina o'z xirillashingni eshitasan.",
                "Sening dod-faryodingni hech kim, hech qachon eshitmaydi.",
                "Ko'zlaring dahshatdan ochiq qotib qoladi.",
                "Jonsiz va parchalangan tanang hech qachon topilmaydi.",
                "Ruhing o'sha zax joyda abadiy azob chekib sargardon qoladi.",
                "Oxirgi ko'rgan narsang o'zingning qonga belangan qo'llaring bo'ladi.",
                "Bu azob hatto o'limingdan keyin ham asrlar davom etadi.",
                "Seni eslaganlar faqatgina qora tushlarida ko'rib, dahshatga tushishadi.",
                "O'lim farishtasi joningni eng shafqatsiz usulda sug'urib oladi.",
                "Qoning yerga singib, o'sha joy abadiy la'natlangan maskanga aylanadi."
            ]
        };

        function generateUniqueStory(name) {
            const loc = storyParts.locations[Math.floor(Math.random() * storyParts.locations.length)];
            const evt = storyParts.events[Math.floor(Math.random() * storyParts.events.length)];
            const conc = storyParts.conclusions[Math.floor(Math.random() * storyParts.conclusions.length)];
            
            return `${name}, sen ${loc}, kutilmaganda ${evt}. ${conc}`;
        }

        generateBtn.addEventListener('click', () => {
            if (attempts >= MAX_ATTEMPTS) {
                triggerJumpscare();
                return;
            }

            const name = document.getElementById('userName').value.trim();
            const ageInput = document.getElementById('userAge').value;
            
            if (!name || !ageInput) {
                resultDiv.innerHTML = "<span style='color:#ff0000;'>Ism va yoshingizni kiritishingiz shart... Hali vaqtingiz bor.</span>";
                return;
            }

            const currentAge = parseInt(ageInput);
            
            generateBtn.disabled = true;
            generateBtn.textContent = "Ruhlar bilan bog'lanmoqda...";
            resultDiv.innerHTML = "<div class='loading-text'>Taqdir kitobi varaqlanmoqda...</div>";

            // Simulyatsiya qilingan kechikish (Go'yoki AI o'ylayotgandek)
            setTimeout(() => {
                const dateData = calculateDeathDate(currentAge);
                const story = generateUniqueStory(name);

                resultDiv.innerHTML = `
                    <span class="name-highlight">${name}</span>
                    <div>Siz <b>${dateData.formattedDate}</b> yili, <span class="highlight">${dateData.deathAge} yoshingizda</span> olamdan o'tasiz.</div>
                    <br>
                    <div><i>"${story}"</i></div>
                    <span class="god-knows">... yana Xudo biladi.</span>
                `;
                
                attempts++;
                
                if (attempts === MAX_ATTEMPTS) {
                    generateBtn.textContent = "So'nggi haqiqat";
                    generateBtn.style.backgroundColor = "#800000"; 
                    generateBtn.style.color = "#fff";
                } else {
                    generateBtn.disabled = false;
                    generateBtn.textContent = "O'lim generatori";
                }
            }, 1500);
        });
    </script>
</body>
</html>
