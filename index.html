<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdiringizni Biling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Roboto:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            /* Sirli qora-yashil o'rmon foni */
            background-image: 
                linear-gradient(to bottom, rgba(0, 30, 0, 0.7), rgba(0, 0, 0, 1)),
                url('https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #00ff7f;
            font-family: 'Roboto', sans-serif;
            /* Mobil qurilmalar uchun dinamik balandlik va skroll */
            min-height: 100dvh; 
            padding: 40px 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto; 
            position: relative;
        }

        .window-glass {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .glitch-effect {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 20, 0, 0.1),
                rgba(0, 20, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
        }

        .blood-drop {
            position: fixed;
            width: 4px;
            height: 15px;
            /* Haqiqiy qizil qon rangi */
            background: linear-gradient(to bottom, rgba(200,0,0,0), rgba(200,0,0,0.7), rgba(150,0,0,1));
            border-radius: 0 0 50% 50%;
            animation: bloodFall linear forwards;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 0 2px #ff0000);
        }

        @keyframes bloodFall {
            0% { top: -20px; opacity: 0; height: 10px;}
            10% { opacity: 0.9; height: 40px;}
            80% { opacity: 0.7; height: 100px;}
            100% { top: 110vh; opacity: 0; height: 150px; }
        }

        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #550000;
            /* Haqiqiy qon sachragan effekt (Gradientlar yordamida) */
            background-image: 
                radial-gradient(circle at 50% 50%, #ff0000 0%, transparent 70%),
                radial-gradient(circle at 20% 30%, #cc0000 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #990000 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, #aa0000 0%, transparent 55%);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: bloodSplash 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, shake 0.4s infinite;
        }

        @keyframes bloodSplash {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        #jumpscare-overlay h1 {
            font-family: 'Nosifer', cursive;
            /* Ekran hajmiga qarab moslashuvchi shrift: Telefonlarda qirqilmaydi */
            font-size: clamp(35px, 10vw, 80px); 
            color: #000;
            text-shadow: 0 0 20px #fff;
            text-transform: uppercase;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(1deg); }
            50% { transform: translate(-2px, 3px) rotate(-1deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(4px, 2px) rotate(-1deg); }
            80% { transform: translate(-2px, -2px) rotate(1deg); }
            90% { transform: translate(2px, 3px) rotate(0deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }

        #start-btn {
            padding: 20px 40px;
            font-size: clamp(20px, 5vw, 26px);
            font-family: 'Nosifer', cursive;
            color: #006400;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #006400;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            text-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            border-radius: 10px;
        }

        #start-btn:hover {
            color: #00ff7f;
            border-color: #00ff7f;
            background: rgba(0, 50, 0, 0.9);
            box-shadow: 0 0 50px rgba(0, 255, 127, 0.8);
            transform: scale(1.05);
        }

        #generator-modal {
            display: none;
            flex-direction: column;
            background: rgba(0, 15, 0, 0.95); 
            border: 1px solid #004d00;
            padding: 30px;
            border-radius: 15px;
            z-index: 10;
            box-shadow: 0 0 60px rgba(0, 255, 127, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 1s ease-in;
            margin: auto; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: clamp(32px, 8vw, 40px);
            color: #00ff7f;
            margin-bottom: 25px;
            text-shadow: 3px 3px 10px #000, 0 0 20px #006400;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #051005;
            border: 1px solid #003300;
            color: #00ff7f;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
        }

        input:focus {
            border-color: #00ff7f;
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.4);
            background: #0a150a;
        }

        #generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-family: 'Creepster', cursive;
            color: #000; 
            background: #008000;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff7f;
        }

        #generate-btn:hover {
            background: #00ff7f;
            box-shadow: 0 0 25px #00ff7f;
            transform: scale(1.02);
        }

        #result {
            margin-top: 30px;
            font-size: 18px;
            line-height: 1.6;
            color: #e6e6e6;
            text-shadow: 0 0 8px rgba(0, 255, 127, 0.3);
            text-align: left;
        }
        
        .highlight {
            color: #00ff7f;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 10px #00ff7f;
        }

        .name-highlight {
            color: #00ff7f;
            font-family: 'Creepster', cursive;
            font-size: 28px;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 15px;
            text-align: center;
        }

        .god-knows {
            display: block;
            margin-top: 25px;
            font-size: 16px;
            font-style: italic;
            color: #55aa55;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="window-glass"></div>
    <div class="glitch-effect"></div>

    <button id="start-btn">Eshikni Ochish...</button>

    <div id="generator-modal">
        <h1>Taqdiringiz bitilgan</h1>
        <input type="text" id="userName" placeholder="Ismingizni kiriting..." required autocomplete="off">
        <input type="number" id="userAge" placeholder="Yoshingizni kiriting..." required min="1" max="120">
        <button id="generate-btn">O'lim generatori</button>
        <div id="result"></div>
    </div>
    
    <div id="jumpscare-overlay">
        <h1>YO'QOL MUNOFIQ!</h1>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const modal = document.getElementById('generator-modal');
        const generateBtn = document.getElementById('generate-btn');
        const resultDiv = document.getElementById('result');
        const inputs = document.querySelectorAll('input');
        const jumpscareOverlay = document.getElementById('jumpscare-overlay');

        let attempts = 0; 
        const MAX_ATTEMPTS = 3;
        
        const bgMusic = new Audio('https://cdn.pixabay.com/download/audio/2022/01/20/audio_f52313d312.mp3?filename=dark-ambient-116675.mp3');
        bgMusic.loop = true; 
        
        const screamAudio = new Audio('https://cdn.pixabay.com/download/audio/2022/03/10/audio_5502b4d241.mp3?filename=woman-scream-117865.mp3');
        screamAudio.volume = 1.0;

        function createBloodDrop() {
            const drop = document.createElement('div');
            drop.classList.add('blood-drop');
            // Ekranning ixtiyoriy joyidan oqib tushadi
            drop.style.left = Math.random() * 100 + 'vw';
            
            const sizeMultiplier = Math.random() * 1.5 + 0.5;
            drop.style.transform = `scale(${sizeMultiplier})`;
            
            drop.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
            drop.style.animationDelay = '0s';
            
            document.body.appendChild(drop);
            setTimeout(() => { drop.remove(); }, 3500);
        }

        // Qon faqat yozayotganda oqadi
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                for(let i=0; i<2; i++) {
                    createBloodDrop();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            bgMusic.play().catch(e => console.log("Audio ruxsati kerak"));
            startBtn.style.display = 'none';
            modal.style.display = 'flex';
        });

        function calculateDeathDate(currentAge) {
            const baseDate = new Date(2026, 7, 1); // 2026 yil 1 Avgust
            
            let maxLifespan = 85; 
            if (currentAge >= 80) maxLifespan = currentAge + 5;
            
            let yearsLeft = maxLifespan - currentAge;
            if (yearsLeft < 1) yearsLeft = 1; 

            // Yosh bo'lsa ham kutilmaganda barvaqt vafot etish ehtimoli
            if (Math.random() < 0.25 && yearsLeft > 10) {
                yearsLeft = Math.floor(Math.random() * 15) + 1;
            }

            const randomDaysLeft = Math.floor(Math.random() * (yearsLeft * 365));
            const deathDate = new Date(baseDate.getTime() + (randomDaysLeft * 24 * 60 * 60 * 1000));
            
            const dd = String(deathDate.getDate()).padStart(2, '0');
            const mm = String(deathDate.getMonth() + 1).padStart(2, '0');
            const yyyy = deathDate.getFullYear();
            
            const deathAge = currentAge + Math.floor(randomDaysLeft / 365);
            return { formattedDate: `${dd}.${mm}.${yyyy}`, deathAge: deathAge };
        }

        function triggerJumpscare() {
            modal.style.display = 'none';
            jumpscareOverlay.style.display = 'flex';
            
            bgMusic.pause();
            screamAudio.play().catch(e => console.log("Ovoz bloklandi"));
        }

        // API ishlamasa ham minglab xilma-xil stsenariylar yaratib beradi.
        const introWords = [
            "hech narsadan bexabar", "ko'zlaring quvonchga to'lib", "shoshilgancha", 
            "chuqur o'yga tolib", "kutilmaganda", "odatiy kuningni o'tkazayotib", 
            "hayotdan zerikib", "uxlashga tayyorgarlik ko'rayotib", "kimnidir kutib",
            "yomg'irli kunda", "qalin tuman ichida", "issiq yoz oqshomida",
            "yangi reja tuzayotgan paytingda", "juda charchagan holatda",
            "telefonga termulib", "ishdan charchab qaytayotganingda", 
            "yangi kiyim kiyib, oyna oldida turganingda", "yaqinlaring bilan kulishib o'tirgan payting", 
            "g'alati tushdan cho'chib uyg'onganingda", "quloqchinlarda sevimli musiqangni tinglab", 
            "osmonga qarab yulduzlarni sanayotganingda", "hech kim yo'qligidan foydalanib", 
            "ichingda g'alati qorquvni his qilib", "kim bilandir urishib qolib, asabiy holatda", 
            "shirin ovqat tanovul qilayotganingda", "qorong'ida yorug'lik qidirib", 
            "do'stlaringga xabar yozayotgan paytingda", "ko'zgudagi aksingga uzoq termulib qolganda", 
            "yangi orzular qilib, jilmayganingda", "kuchli shamol yuzingga urilayotganda", 
            "biror narsani yo'qotib qo'yib, asabiylashib qidirayotganda", "jimgina derazadan tashqariga tikilib", 
            "yo'lni kesib o'tishga tayyorlanayotganingda", "hech qanday yomonlikni sezmay", 
            "o'zingni dunyodagi eng baxtli insondek his qilib", "eski rasmlarni ko'rib, xotiralarga berilib", 
            "esdan chiqib qolgan muhim ishni eslaganingda", "kutilmagan qo'ng'iroqqa javob berayotib", 
            "mashina oynasidan shamol qilib ketayotganingda", "chuqur uxlashga yotganingda"
        ];

        const locations = [
            "katta trassadan o'tayotganingda", "o'z uyingning hammomida", "qorong'i xiyobonda", 
            "ishxonadagi zinapoyada", "odamgavjum bekatda", "tor va qorong'i ko'chada", 
            "shifoxona yo'lagida", "poezd vagonida", "nam va sovuq yerto'lada", 
            "uzun ko'prik ustida", "mashina o'rindig'ida", "eski tashlandiq binoda",
            "osmono'par binoning tomida", "ko'l bo'yida", "toqqa chiqqaningda",
            "aeroport kutish zalida", "yangi qurilayotgan obyekt yonida",
            "shovqinli restoranda", "bo'm-bo'sh yerosti yo'lida", "kimsasiz parkda", 
            "o'z yotog'ingda", "mehmonxona xonasida", "qabriston yonidan o'tayotganda", 
            "tun yarmida oshxonada", "sportzalda mashq qilayotganda", "katta savdo markazining eskalatorida", 
            "kinoteatrning eng oxirgi qatorida", "bankomat oldida pul yechayotganingda", 
            "sovuq va qorong'i garajda", "dengiz sohilida", "eski chang bosgan chordoqda", 
            "metro vagonida", "yoqilg'i quyish shoxobchasida", "qalin o'rmon oralab ketayotganingda", 
            "hovlidagi eski daraxt tagida", "balkonda havoga chiqib turganingda", "ta'mirtalab kvartirada", 
            "shahar tashqarisidagi kimsasiz yo'lda", "katta avtobusning orqa o'rindig'ida", 
            "kimyoviy laboratoriyada", "bo'sh qolgan basseyn ichida", "eski kasalxonaning tashlandiq qismida", 
            "tiqilinch bozorda", "kimsasiz orolda", "yashirin savdo joyida", 
            "uzoq qarindoshingning eski uyida", "baland sharshara yonida", "kutubxonaning eng qorong'i burchagida", 
            "oynalari singan eski vagon ichida", "chirog'i o'chgan ko'p qavatli uyning podyezdida"
        ];

        const causes = [
            "boshqaruvni yo'qotgan yuk mashinasi ostida qolib", "tepadan tushgan og'ir beton bo'lagidan zarba yeb", 
            "kuchli tok urishi natijasida tanang yonib ketib", "yuraging to'satdan to'xtab qolib", 
            "kutilmagan hujum va sovuq qurol jarohatidan", "nafas yo'lingga bir narsa tiqilib qolib", 
            "kuchli yong'in ichida qochishga yo'l topolmay", "noma'lum portlash zarbasiga uchrab", 
            "zinadan yomon yiqilib bo'yning sinishi oqibatida", "chuqur suvga cho'kib nafasololmay", 
            "is gazidan zaharlanib", "noma'lum va davosiz virus sabab",
            "avtohalokatda mashina pachoqlanishidan", "yuqori qon bosimi va insultdan",
            "juda kuchli stressdan miyangga qon quyilib", "kutilmagan yovvoyi hayvon hujumidan",
            "kuchli zaharli o'rgimchak chaqib olishidan", "kislota to'kilishi oqibatida", 
            "asab tiziming ishdan chiqib qotib qolib", "tomog'ingga shisha sinig'i sanchilib", 
            "yuqori balandlikdan pastga qulab", "ko'rchak ichagi yorilib ketib qon yo'qotishdan", 
            "kuchli chaqmoq urishidan", "ko'chkiga duch kelib tuproq ostida qolib", 
            "muz ustida sirpanib qattiq yerga bosh urib", "g'irt mast haydovchining qurboni bo'lib", 
            "tuzalmas qon kasalligiga chalinib", "issiq xonada kislorod yetishmasligidan", 
            "zaharli kimyoviy modda hidlab qo'yib", "tormozi ishlamagan poyezd ostida qolib", 
            "kuchli allergik reaksiya dan (anafilaktik shok)", "og'ir temir buyum ostida qisilib qolib", 
            "sovuqda muzlab qotib qolib", "notanish ovqatdan qattiq zaharlanib", 
            "quturgan itlarning talashidan", "tomirga noto'g'ri ukol qilinishidan", 
            "kuchli qon ketishini to'xtata olmay", "texnik nosozlik sabab qulab tushishidan", 
            "oyna sinib arteriya tomiringni kesib ketishidan", "uzoq davom etgan ochlik va suvsizlikdan", 
            "kuchli bosim ostida o'pkang yorilib ketishidan", "qorong'ida chuqur quduqqa tushib ketib", 
            "chala pishgan go'shtdagi parazitlar miyangni zararlab", "xatoga yo'l qo'ygan jarroh tig'i ostida", 
            "ko'r-ko'rona otilgan adashgan o'qdan", "gaz ballonining to'satdan portlashidan", 
            "noto'g'ri isitish tizimidan chiqqan tutun tufayli", "qattiq sovuqda uxlab qolib boshqa uyg'onmay", 
            "tasodifiy olomonda tiqilinch ostida qolib", "noma'lum kimyoviy moddadan tanang zaharlanib"
        ];

        const endings = [
            "jon berasan.", "so'nggi nafasingni olasan.", "ko'zlaring mangu yumiladi.", 
            "hayot bilan azobda vidolashasan.", "bu olamni jim tashlab ketasan.",
            "hech kim senga yordam bera olmaydi.", "tuproqqa qorishasan.",
            "qorachiqlaringda daxshat qotib qoladi.", "atrofingdagilar faqat dod-faryodingni eslab qolishadi.", 
            "tanang muzdek qotib qoladi.", "ruhing azob bilan tanangni tark etadi.", 
            "oxirgi so'zingni ham aytishga ulgurmaysan.", "qoning butun atrofni qizilga bo'yaydi.", 
            "ko'zlaringdan yosh o'rniga qon oqadi.", "jəsədingni topishlariga oylab vaqt ketadi.", 
            "yaqinlaring seni hech qachon bunday holda ko'rishni xohlamasdi.", "bu sening hayotingdagi eng uzun soniyalar bo'ladi.", 
            "faqatgina shamol sening o'limingga guvoh bo'ladi.", "o'sha joy sening mangu qabringga aylanadi.", 
            "shuncha orzularing bir soniyada kulga aylanadi.", "hayoting xuddi uzilgan kinotasmadek to'xtaydi.", 
            "hech kim sening nima xis qilganingni tushunolmaydi.", "tanang qora tuproq ostiga kirishini kutib yotadi.", 
            "faqat bo'g'iq ingrash sening so'nggi sasing bo'ladi.", "olam sening ko'zlaringda qop-qoraga aylanadi.", 
            "ismi-sharifing faqat o'lim haqidagi qog'ozlarda qoladi.", "hayotingning so'nggi pərdasi shu tarzda yopiladi."
        ];

        function generateUniqueStory(name) {
            const intro = introWords[Math.floor(Math.random() * introWords.length)];
            const loc = locations[Math.floor(Math.random() * locations.length)];
            const cause = causes[Math.floor(Math.random() * causes.length)];
            const end = endings[Math.floor(Math.random() * endings.length)];
            
            return `${name}, sen ${intro} ${loc}, ${cause} ${end}`;
        }

        generateBtn.addEventListener('click', () => {
            // Agar 3 marta bosilgan bo'lsa (ya'ni attempts = 3 bo'lsa, bu 4-klik)
            if (attempts >= MAX_ATTEMPTS) {
                triggerJumpscare();
                return;
            }

            const name = document.getElementById('userName').value.trim();
            const ageInput = document.getElementById('userAge').value;
            
            if (!name || !ageInput) {
                resultDiv.innerHTML = "<span style='color:#ff0000;'>Ism va yoshingizni kiritishingiz shart...</span>";
                return;
            }

            const currentAge = parseInt(ageInput);
            
            const dateData = calculateDeathDate(currentAge);
            const story = generateUniqueStory(name);

            resultDiv.innerHTML = `
                <span class="name-highlight">${name}</span>
                <div>Siz <b>${dateData.formattedDate}</b> yili, <span class="highlight">${dateData.deathAge} yoshingizda</span> olamdan o'tasiz.</div>
                <br>
                <div><i>"${story}"</i></div>
                <span class="god-knows">... yana Xudo biladi.</span>
            `;
            
            attempts++;
            
            // Agar 3 marta ishlatilgan bo'lsa, tugmani qo'rqinchli tusga kiritamiz
            if (attempts === MAX_ATTEMPTS) {
                generateBtn.textContent = "So'nggi haqiqatni bilish";
                generateBtn.style.backgroundColor = "#550000"; 
                generateBtn.style.color = "#fff";
                generateBtn.style.boxShadow = "0 0 20px #ff0000";
            }
        });
    </script>
</body>
</html>
