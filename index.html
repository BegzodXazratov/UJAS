<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdiringizni Biling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Roboto:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            background-image: 
                linear-gradient(to bottom, rgba(0, 30, 0, 0.7), rgba(0, 0, 0, 1)),
                url('https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: #00ff7f;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* We'll change this to red in JS for the jumpscare */
            transition: background-color 0.1s; 
        }

        .window-glass {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            /* Makes it look like we are looking through a wet, dirty window */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .glitch-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 20, 0, 0.1),
                rgba(0, 20, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
        }

        .rain-drop {
            position: absolute;
            width: 3px;
            height: 15px;
            background: linear-gradient(to bottom, rgba(0,255,127,0), rgba(0,255,127,0.5), rgba(0,255,127,0.8));
            border-radius: 0 0 50% 50%;
            animation: rainFall linear forwards;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 0 2px #00ff7f);
        }

        @keyframes rainFall {
            0% { top: -20px; opacity: 0; height: 10px;}
            10% { opacity: 0.8; height: 30px;}
            /* Simulate sliding down a window, leaving a trail */
            80% { opacity: 0.6; height: 80px;}
            100% { top: 110vh; opacity: 0; height: 150px; }
        }

        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ff0000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: shake 0.5s infinite;
        }

        #jumpscare-overlay h1 {
            font-family: 'Nosifer', cursive;
            font-size: 80px;
            color: #000;
            text-shadow: 0 0 20px #fff;
            text-transform: uppercase;
            text-align: center;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 26px;
            font-family: 'Nosifer', cursive;
            color: #006400;
            background: rgba(0, 20, 0, 0.6);
            border: 2px solid #006400;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            text-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            border-radius: 10px;
        }

        #start-btn:hover {
            color: #00ff7f;
            border-color: #00ff7f;
            background: rgba(0, 50, 0, 0.8);
            box-shadow: 0 0 50px rgba(0, 255, 127, 0.8), inset 0 0 20px rgba(0, 255, 127, 0.3);
            transform: scale(1.1);
        }

        #generator-modal {
            display: none;
            flex-direction: column;
            background: rgba(0, 15, 0, 0.95); /* Darker green background */
            border: 1px solid #004d00;
            padding: 40px;
            border-radius: 15px;
            z-index: 10;
            box-shadow: 0 0 60px rgba(0, 255, 127, 0.2);
            width: 90%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 40px;
            color: #00ff7f;
            margin-bottom: 30px;
            text-shadow: 3px 3px 10px #000, 0 0 20px #006400;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #0a140a;
            border: 1px solid #003300;
            color: #00ff7f;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
        }

        input:focus {
            border-color: #00ff7f;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
            background: #0f1f0f;
        }

        #generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            font-family: 'Creepster', cursive;
            color: #000; /* Better contrast */
            background: #008000;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff7f;
        }

        #generate-btn:hover:not(:disabled) {
            background: #00ff7f;
            box-shadow: 0 0 30px #00ff7f;
            transform: scale(1.02);
        }

        #generate-btn:disabled {
            background: #113311;
            color: #336633;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 35px;
            font-size: 20px;
            line-height: 1.6;
            color: #e6e6e6;
            text-shadow: 0 0 10px rgba(0, 255, 127, 0.5);
            min-height: 80px;
            text-align: left;
        }
        
        .highlight {
            color: #00ff7f;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 15px #00ff7f;
        }

        .name-highlight {
            color: #00ff7f;
            font-family: 'Creepster', cursive;
            font-size: 32px;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 15px;
            text-align: center;
        }

        .god-knows {
            display: block;
            margin-top: 30px;
            font-size: 18px;
            font-style: italic;
            color: #55aa55;
            text-shadow: none;
            text-align: right;
        }
        
        .loading-text {
            color: #00ff7f;
            font-style: italic;
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="window-glass"></div>
    <div class="glitch-effect"></div>

    <div id="audio-container" style="display:none;"></div>

    <button id="start-btn">Eshikni Ochish...</button>

    <div id="generator-modal">
        <h1>Taqdiringiz bitilgan</h1>
        <input type="text" id="userName" placeholder="Ismingizni kiriting..." required autocomplete="off">
        <input type="number" id="userAge" placeholder="Yoshingizni kiriting..." required min="1" max="120">
        <button id="generate-btn">O'lim generatori</button>
        <div id="result"></div>
    </div>
    
    <div id="jumpscare-overlay">
        <h1>YO'QOL MUNOFIQ!</h1>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const modal = document.getElementById('generator-modal');
        const generateBtn = document.getElementById('generate-btn');
        const resultDiv = document.getElementById('result');
        const audioContainer = document.getElementById('audio-container');
        const inputs = document.querySelectorAll('input');
        const jumpscareOverlay = document.getElementById('jumpscare-overlay');

        let attempts = 0; 
        const MAX_ATTEMPTS = 3;
        
        const apiKey = ""; // API key will be injected by Canvas
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        function createRainDrop() {
            const drop = document.createElement('div');
            drop.classList.add('rain-drop');
            drop.style.left = Math.random() * 100 + 'vw';
            
            // Randomize size and speed for realism
            const sizeMultiplier = Math.random() * 1.5 + 0.5;
            drop.style.transform = `scale(${sizeMultiplier})`;
            
            drop.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
            
            // Random delay so they don't all fall at once
            drop.style.animationDelay = Math.random() * 0.5 + 's';
            
            document.body.appendChild(drop);
            
            // Remove after animation completes
            setTimeout(() => { drop.remove(); }, 3500);
        }

        // Start rain effect immediately
        setInterval(createRainDrop, 150);

        // More drops when typing
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                for(let i=0; i<3; i++) {
                    createRainDrop();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            // Load background music (Silent Hill inspired or similar creepy track)
            audioContainer.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/MPa-y1LQjOk?autoplay=1&loop=1&playlist=MPa-y1LQjOk" frameborder="0" allow="autoplay"></iframe>`;
            startBtn.style.display = 'none';
            modal.style.display = 'flex';
        });

        function calculateDeathDate(currentAge) {
            const baseDate = new Date(2026, 7, 1); // August 1, 2026
            
            // Realistic lifespan assumption (max ~100-110, average 70-80)
            let maxLifespan = 85; 
            if (currentAge >= 80) maxLifespan = currentAge + 5; // Give them a few more years if they are already old
            
            let yearsLeft = maxLifespan - currentAge;
            if (yearsLeft < 1) yearsLeft = 1; 

            // Add some randomness - some die young, some live long
            // 20% chance of dying much earlier
            if (Math.random() < 0.2 && yearsLeft > 10) {
                yearsLeft = Math.floor(Math.random() * 10) + 1;
            }

            const randomDaysLeft = Math.floor(Math.random() * (yearsLeft * 365));
            const deathDate = new Date(baseDate.getTime() + (randomDaysLeft * 24 * 60 * 60 * 1000));
            
            const dd = String(deathDate.getDate()).padStart(2, '0');
            const mm = String(deathDate.getMonth() + 1).padStart(2, '0');
            const yyyy = deathDate.getFullYear();
            
            const deathAge = currentAge + Math.floor(randomDaysLeft / 365);
            return { formattedDate: `${dd}.${mm}.${yyyy}`, deathAge: deathAge };
        }

        function triggerJumpscare() {
            // Hide modal, show red overlay
            modal.style.display = 'none';
            jumpscareOverlay.style.display = 'flex';
            
            // Stop youtube music (remove iframe)
            audioContainer.innerHTML = '';
            
            // Create audio context for the scream
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Synthesize a terrible noise (since we can't easily load external assets)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                // Harsh, dissonant frequencies
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1);
                
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
                
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 2);
                osc2.stop(audioCtx.currentTime + 2);
                
            } catch (e) {
                console.log("Audio API not supported");
            }
        }

        async function fetchStoryFromGemini(name, dateData) {
            const prompt = `Sen sirli va dahshatli taqdirni aytib beruvchi tilsan.
            Mijozning ismi: ${name}. 
            Uning o'lim yoshi: ${dateData.deathAge}.
            Vazifa: Bu odam aynan shu yoshida qanday qilib va qayerda fojiali tarzda o'lishi haqida o'zbek tilida 2-3 gapdan iborat qisqa, mikstik va juda qo'rqinchli hikoya yozib ber. 
            Hikoya uning ismini aytib, bevosita unga murojaat qilish bilan boshlanishi kerak (Masalan: "Asadbek, sen...").
            Hech qanday salomlashish, tushuntirish yoki ortiqcha so'zlar bo'lmasin. Faqat hikoyani o'zini qaytar.`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: {
                    parts: [{ text: "Siz qisqa, qo'rqinchli va sirli hikoyalar yozuvchisisiz. Faqat so'ralgan ma'lumotni o'zbek tilida qaytarasiz." }]
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error("Invalid response from Gemini");
                }
            } catch (error) {
                console.error("Gemini API xatosi:", error);
                return `${name}, seni qorong'i o'rmon qa'rida, ismingni chaqirayotgan noma'lum sharpalar qurshovida topishadi. Nafasing uzilayotganda faqat sovuq shamol ovozini eshitasan.`;
            }
        }

        generateBtn.addEventListener('click', async () => {
            // Check if attempt limit reached
            if (attempts >= MAX_ATTEMPTS) {
                triggerJumpscare();
                return;
            }

            const name = document.getElementById('userName').value.trim();
            const ageInput = document.getElementById('userAge').value;
            
            if (!name || !ageInput) {
                resultDiv.innerHTML = "<span style='color:#ff0000;'>Ism va yoshingizni kiritishingiz shart...</span>";
                return;
            }

            const currentAge = parseInt(ageInput);
            
            generateBtn.disabled = true;
            generateBtn.textContent = "Ruhlar bilan bog'lanmoqda...";
            resultDiv.innerHTML = "<div class='loading-text'>Taqdir kitobi varaqlanmoqda...</div>";

            try {
                const dateData = calculateDeathDate(currentAge);
                
                // Call Gemini API to generate the story
                const story = await fetchStoryFromGemini(name, dateData);

                // Format the output
                resultDiv.innerHTML = `
                    <span class="name-highlight">${name}</span>
                    <div>Siz <b>${dateData.formattedDate}</b> yili, <span class="highlight">${dateData.deathAge} yoshingizda</span> olamdan o'tasiz.</div>
                    <br>
                    <div><i>"${story}"</i></div>
                    <span class="god-knows">... yana Xudo biladi.</span>
                `;
                
                attempts++;
                
                if (attempts === MAX_ATTEMPTS) {
                    generateBtn.textContent = "So'nggi haqiqat";
                    generateBtn.style.backgroundColor = "#800000"; // Turn button red for the last try
                    generateBtn.style.color = "#fff";
                }
            } catch (error) {
                 resultDiv.innerHTML = "<span style='color:#ff0000;'>Zulmat bilan aloqa uzildi. Qaytadan urinib ko'ring.</span>";
            } finally {
                if (attempts < MAX_ATTEMPTS) {
                    generateBtn.disabled = false;
                    generateBtn.textContent = "O'lim generatori";
                } else {
                     generateBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
