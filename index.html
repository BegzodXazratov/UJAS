<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdiringizni Biling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Roboto:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            /* Fon rasmi qizil o'rniga yashil-qora o'rmon rasmi bilan almashtirildi */
            background-image: 
                linear-gradient(to bottom, rgba(0,20,0,0.8), rgba(0,0,0,1)),
                url('https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            /* Asosiy matn rangi yashil qilindi */
            color: #00ff7f;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Eski blood-overlay olib tashlandi, o'rniga rain-overlay qo'shildi */
        .rain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            /* Oynadagi yomg'ir effekti uchun filtr */
            backdrop-filter: blur(2px);
        }

        .glitch-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 20, 0, 0.1),
                rgba(0, 20, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Yangi qon (yomg'ir izi) animatsiyasi */
        .rain-streak {
            position: absolute;
            top: -100px;
            width: 2px;
            background: linear-gradient(to bottom, rgba(255,0,0,0), rgba(200,0,0,0.8), rgba(139,0,0,1));
            border-radius: 50%;
            /* Soyalar yashil rangga moslandi */
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
            animation: streakFall linear forwards;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes streakFall {
            0% { top: -50px; height: 20px; opacity: 0.1; }
            20% { opacity: 0.8; }
            100% { top: 110vh; height: 150px; opacity: 0; }
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 26px;
            font-family: 'Nosifer', cursive;
            /* Tugma ranglari yashil rangga o'zgartirildi */
            color: #006400;
            background: rgba(0, 20, 0, 0.6);
            border: 2px solid #006400;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            text-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
            box-shadow: 0 0 30px rgba(0, 100, 0, 0.3);
            border-radius: 10px;
        }

        #start-btn:hover {
            color: #00ff7f;
            border-color: #00ff7f;
            background: rgba(0, 50, 0, 0.8);
            box-shadow: 0 0 50px rgba(0, 255, 127, 0.8), inset 0 0 20px rgba(0, 255, 127, 0.3);
            transform: scale(1.1);
        }

        #generator-modal {
            display: none;
            flex-direction: column;
            /* Modal foni va chegarasi yashil rangga moslandi */
            background: rgba(0, 10, 0, 0.95);
            border: 1px solid #004d00;
            padding: 40px;
            border-radius: 15px;
            z-index: 10;
            box-shadow: 0 0 60px rgba(0, 255, 127, 0.2);
            width: 90%;
            max-width: 550px;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 40px;
            /* Sarlavha rangi va soyasi yashil qilindi */
            color: #00ff7f;
            margin-bottom: 30px;
            text-shadow: 3px 3px 10px #000, 0 0 20px #006400;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            /* Input maydoni ranglari yashil qilindi */
            background: #0a140a;
            border: 1px solid #003300;
            color: #00ff7f;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
        }

        input:focus {
            border-color: #00ff7f;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
            background: #0f1f0f;
        }

        #generate-btn {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            font-family: 'Creepster', cursive;
            color: #fff;
            /* Generatsiya tugmasi rangi yashil qilindi */
            background: #006400;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
            border-radius: 5px;
            text-shadow: 1px 1px 5px #000;
        }

        #generate-btn:hover:not(:disabled) {
            background: #008000;
            box-shadow: 0 0 30px #00ff7f;
            transform: scale(1.02);
        }

        #generate-btn:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 35px;
            font-size: 22px;
            line-height: 1.6;
            color: #e6e6e6;
            /* Natija matni soyasi yashil qilindi */
            text-shadow: 0 0 10px #00ff7f;
            min-height: 80px;
        }
        
        .highlight {
            /* Ta'kidlash ranglari yashil qilindi */
            color: #00ff7f;
            font-weight: bold;
            font-size: 26px;
            text-shadow: 0 0 15px #00ff7f;
        }

        .name-highlight {
            /* Ism ta'kidlash rangi yashil qilindi */
            color: #00ff7f;
            font-family: 'Creepster', cursive;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .god-knows {
            display: block;
            margin-top: 20px;
            font-size: 18px;
            font-style: italic;
            color: #888;
            text-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Eski blood-overlay o'rniga rain-overlay ishlatildi -->
    <div class="rain-overlay"></div>
    <div class="glitch-effect"></div>

    <div id="audio-container" style="display:none;"></div>

    <button id="start-btn">Eshikni Ochish...</button>

    <div id="generator-modal">
        <h1>Taqdiringiz bitilgan</h1>
        <input type="text" id="userName" placeholder="Ismingizni kiriting..." required autocomplete="off">
        <input type="number" id="userAge" placeholder="Yoshingizni kiriting..." required min="1" max="120">
        <button id="generate-btn">O'lim generatori</button>
        <div id="result"></div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const modal = document.getElementById('generator-modal');
        const generateBtn = document.getElementById('generate-btn');
        const resultDiv = document.getElementById('result');
        const audioContainer = document.getElementById('audio-container');
        const inputs = document.querySelectorAll('input');

        let attempts = 0; 
        const currentYear = 2026;
        
        // Gemini API kaliti Canvas tomonidan taqdim etiladi
        const apiKey = "";

        // Yangi qon (yomg'ir izi) yaratish funksiyasi
        function createRainStreak() {
            const streak = document.createElement('div');
            streak.classList.add('rain-streak');
            streak.style.left = Math.random() * 100 + 'vw';
            // Animatsiya tezligi va davomiyligini tasodifiy qilish
            streak.style.animationDuration = (Math.random() * 1 + 0.5) + 's'; 
            streak.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(streak);
            
            setTimeout(() => { streak.remove(); }, 3000);
        }

        // Sahifa yuklanganda avtomatik ravishda qon izlari paydo bo'lishi uchun
        setInterval(createRainStreak, 200);

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                // Input kiritilganda ko'proq iz paydo bo'lishi uchun
                for(let i=0; i<5; i++) {
                    createRainStreak();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            audioContainer.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/MPa-y1LQjOk?autoplay=1&loop=1&playlist=MPa-y1LQjOk" frameborder="0" allow="autoplay"></iframe>`;
            startBtn.style.display = 'none';
            modal.style.display = 'flex';
        });

        const locations = [
            "hojatxonada", "kimsasiz parkda", "qorong'i yo'lda", "tashlandiq eski binoda", 
            "keng daryo bo'yida", "o'z uyingizning yerto'lasida", "ishxonadagi lift ichida", 
            "shifoxonaning sovuq palatasida", "mashina o'rindig'ida", "poezd vagonida", 
            "samolyot hojatxonasida", "kimsasiz orolda", "yerto'la zinapoyasida", 
            "qalin o'rmon o'rtasida", "yerosti o'tish yo'lida", "cho'l o'rtasida", 
            "muzlagan ko'l ustida", "baland qoyalar ustida", "omborxonada", "zinapoyada",
            "avtomobil turargohida", "eski qabristonda", "ko'prik ostida"
        ];

        const causes = [
            "mashina urib ketib", "kutilmaganda yonib ketib", "suvga cho'kib ketib", 
            "balandlikdan yiqilib", "yurak xurujidan", "zaharli ilon chaqib", 
            "qotilning sovuq qurolidan", "tasodifiy o'q tegib", "kuchli tok urib", 
            "muzlab qolib", "ochlik va suvsizlikdan", "nafas qisib", 
            "yovvoyi hayvonlar hujum qilib", "kuchli portlash qurboni bo'lib", 
            "zaharli gazdan bo'g'ilib", "boshga og'ir jism tushib", "qorong'ida qoqinib ketib",
            "o'z qo'lingiz bilan", "avtohalokat tufayli majag'lanib", "sirli kasallikka chalinib",
            "chilla vaqtida oftob urib", "yashindek tez kelgan o'lim farishtasidan"
        ];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function calculateDeathDate(currentAge) {
            const baseDate = new Date(2026, 7, 1); // 1-Avgust 2026
            let yearsLeft = 85 - currentAge;
            if (yearsLeft < 1) yearsLeft = 2; // Agar yoshi juda katta bo'lsa
            
            const randomDaysLeft = Math.floor(Math.random() * (yearsLeft * 365));
            const deathDate = new Date(baseDate.getTime() + (randomDaysLeft * 24 * 60 * 60 * 1000));
            
            const dd = String(deathDate.getDate()).padStart(2, '0');
            const mm = String(deathDate.getMonth() + 1).padStart(2, '0');
            const yyyy = deathDate.getFullYear();
            
            const deathAge = currentAge + Math.floor(randomDaysLeft / 365);
            return { formattedDate: `${dd}.${mm}.${yyyy}`, deathAge: deathAge };
        }

        function getDeathScenario() {
            return {
                location: getRandomElement(locations),
                cause: getRandomElement(causes)
            };
        }

        generateBtn.addEventListener('click', async () => {
            if (attempts >= 3) {
                resultDiv.innerHTML = "<span style='color:#00ff7f; font-size:26px;'>Bo'ldi endi, o'zingni aldama!</span>";
                generateBtn.style.display = 'none';
                return;
            }

            const name = document.getElementById('userName').value.trim();
            const ageInput = document.getElementById('userAge').value;
            
            if (!name || !ageInput) {
                resultDiv.innerHTML = "<span style='color:#00ff7f;'>Ism va yoshingizni kiritishingiz shart...</span>";
                return;
            }

            const currentAge = parseInt(ageInput);
            
            generateBtn.disabled = true;
            generateBtn.textContent = "Ruhlar bilan bog'lanmoqda...";
            resultDiv.innerHTML = "";

            try {
                // Ruhlar bilan bog'lanish effektini berish uchun vaqtinchalik kutish
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const dateData = calculateDeathDate(currentAge);
                const scenario = getDeathScenario();

                // Natijani ekranga ko'rsatish
                resultDiv.innerHTML = `
                    <span class="name-highlight">${name}</span>... <br><br> 
                    Siz <b>${dateData.formattedDate}</b> yili, <span class="highlight">${dateData.deathAge} yoshingizda</span>, <br> 
                    <b>${scenario.location}</b>, <br> 
                    <b>${scenario.cause}</b> o'lasan.
                    <span class="god-knows">... yana Xudo biladi.</span>
                `;
                
                attempts++;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = "O'lim generatori";
                
                if (attempts >= 3) {
                    generateBtn.disabled = true;
                    generateBtn.textContent = "Yakunlandi";
                }
            }
        });
    </script>
</body>
</html>
